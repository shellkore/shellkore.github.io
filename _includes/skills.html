<div class="col-lg">
  <h2 class="mb-3">{{ include.title }}</h2>
    {% for skill in include.source %}
      <div class="skill">
        <p>{{ skill.name }}</p>
        {% if skill.percentage %}
        <div class="skill-track" role="progressbar" aria-label="{{ skill.name }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ skill.percentage }}">
          <div class="skill-fill" style="width: {{ skill.percentage }}%"></div>
        </div>
        <span class="skill-value">{{ skill.percentage }}%</span>
        {% endif %}
      </div>
    {% endfor %}
</div>
