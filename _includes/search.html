<!-- Simple-Jekyll-Search https://github.com/christian-fei/Simple-Jekyll-Search -->

<div class="input-group mt-5 px-3">
  <input id="search-input" type="search" class="form-control search-box" placeholder="Search posts..." aria-label="Search posts">
  <div class="input-group-append">
    <span class="input-group-text border border-primary bg-primary text-white"><i class="fas fa-search"></i></span>
  </div>
</div>
<ul class="px-3" id="results-container"></ul>

<script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
<script>
  var sjs = SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('results-container'),
        searchResultTemplate: '<a href="{url}" class="list-group-item list-group-item-action">{title}</a>',
        noResultsText: '<li class="list-group-item">No results found</li>',
        json: '{{ '/search.json' | relative_url }}'
      })
</script>
